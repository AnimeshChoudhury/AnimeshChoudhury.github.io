{% extends "base.html" %}

{% block title %}Page Not Found - {{ profile.name }}{% endblock %}

{% block content %}
<section style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: var(--gradient-hero); color: white;">
    <div class="container" style="text-align: center;">
        <div style="font-size: 10rem; font-family: var(--font-display); font-weight: 900; margin-bottom: 1rem;">404</div>
        <h1 style="font-family: var(--font-display); font-size: 3rem; margin-bottom: 1rem;">Page Not Found</h1>
        <p style="font-size: 1.2rem; opacity: 0.9; margin-bottom: 3rem;">The page you're looking for doesn't exist or has been moved.</p>
        <div style="display: flex; gap: 1.5rem; justify-content: center; flex-wrap: wrap;">
            <a href="{{ url_for('index') }}" class="btn btn-primary">Go Home</a>
            <a href="{{ url_for('projects') }}" class="btn btn-outline">View Projects</a>
        </div>
    </div>
</section>
{% endblock %}
