<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{ profile.name }} - {{ profile.tagline }}. Remote Sensing Researcher specializing in Earth Observation, Machine Learning, and Climate Science.">
    <meta name="keywords" content="Remote Sensing, GIS, Machine Learning, Earth Observation, Climate Science, Drought Monitoring, {{ profile.name }}">
    <meta name="author" content="{{ profile.name }}">
    
    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="{{ profile.name }} - Remote Sensing Researcher">
    <meta property="og:description" content="{{ profile.tagline }}">
    
    <title>{% block title %}{{ profile.name }} - Portfolio{% endblock %}</title>
    
    <!-- Fonts - Bold, distinctive choices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
    
    <style>
        :root {
            /* Creative color scheme - Deep ocean meets earth tones */
            --primary: #0a4d68;        /* Deep ocean blue */
            --primary-light: #088395;   /* Teal */
            --accent: #e8630a;          /* Bold orange */
            --accent-light: #ff8c42;    /* Light orange */
            --dark: #1a1a2e;            /* Almost black */
            --mid-dark: #2d3250;        /* Dark slate */
            --light: #f7f9fb;           /* Off white */
            --text: #2d3250;            /* Text color */
            --text-light: #6b7280;      /* Light text */
            
            /* Gradients */
            --gradient-hero: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 50%, var(--accent) 100%);
            --gradient-card: linear-gradient(145deg, rgba(8, 131, 149, 0.05) 0%, rgba(232, 99, 10, 0.05) 100%);
            
            /* Fonts */
            --font-display: 'Playfair Display', serif;
            --font-mono: 'Space Mono', monospace;
            --font-body: 'Work Sans', sans-serif;
            
            /* Spacing */
            --section-padding: 120px;
            --container-width: 1200px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: var(--font-body);
            color: var(--text);
            background: var(--light);
            line-height: 1.6;
            overflow-x: hidden;
        }
        
        /* Animated grain texture overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            opacity: 0.03;
            pointer-events: none;
            z-index: 9999;
        }
        
        /* Container */
        .container {
            max-width: var(--container-width);
            margin: 0 auto;
            padding: 0 2rem;
        }
        
        /* Navigation - Fixed & Bold */
        nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            z-index: 1000;
            padding: 1.5rem 0;
            border-bottom: 2px solid var(--primary);
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        
        nav .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.02em;
            transition: all 0.3s ease;
        }
        
        .logo:hover {
            color: var(--accent);
            transform: translateY(-2px);
        }
        
        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            align-items: center;
        }
        
        .nav-links a {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 700;
            text-decoration: none;
            color: var(--text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            position: relative;
            transition: color 0.3s ease;
        }
        
        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 3px;
            background: var(--accent);
            transition: width 0.3s ease;
        }
        
        .nav-links a:hover {
            color: var(--accent);
        }
        
        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }
        
        .nav-links a.active {
            color: var(--primary);
        }
        
        /* Mobile menu toggle */
        .menu-toggle {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 6px;
        }
        
        .menu-toggle span {
            width: 30px;
            height: 3px;
            background: var(--primary);
            transition: all 0.3s ease;
        }
        
        /* Main content spacing */
        main {
            padding-top: 80px;
            min-height: 100vh;
        }
        
        /* Footer */
        footer {
            background: var(--dark);
            color: white;
            padding: 3rem 0;
            margin-top: 6rem;
        }
        
        footer .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 2rem;
        }
        
        .footer-social {
            display: flex;
            gap: 1.5rem;
        }
        
        .footer-social a {
            color: white;
            font-size: 1.5rem;
            transition: all 0.3s ease;
        }
        
        .footer-social a:hover {
            color: var(--accent);
            transform: translateY(-3px);
        }
        
        .footer-text {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .nav-links {
                position: fixed;
                top: 80px;
                left: -100%;
                width: 100%;
                height: calc(100vh - 80px);
                background: rgba(255, 255, 255, 0.98);
                flex-direction: column;
                justify-content: center;
                transition: left 0.3s ease;
                padding: 2rem;
            }
            
            .nav-links.active {
                left: 0;
            }
            
            .menu-toggle {
                display: flex;
            }
            
            footer .container {
                flex-direction: column;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="container">
            <a href="{{ url_for('index') }}" class="logo">AC</a>
            <div class="menu-toggle" onclick="toggleMenu()">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="{{ url_for('index') }}" class="{% if request.endpoint == 'index' %}active{% endif %}">Home</a></li>
                <li><a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a></li>
                <li><a href="{{ url_for('projects') }}" class="{% if request.endpoint in ['projects', 'project_detail'] %}active{% endif %}">Projects</a></li>
                <li><a href="{{ url_for('publications') }}" class="{% if request.endpoint == 'publications' %}active{% endif %}">Publications</a></li>
                <li><a href="{{ url_for('contact') }}" class="{% if request.endpoint == 'contact' %}active{% endif %}">Contact</a></li>
                <li><a href="{{ url_for('view_cv') }}" target="_blank" style="background: var(--accent); color: white; padding: 0.5rem 1.5rem; border-radius: 50px;">CV</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-social">
                <a href="{{ profile.social.linkedin }}" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                <a href="{{ profile.social.github }}" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="{{ profile.social.scholar }}" target="_blank" title="Google Scholar"><i class="fas fa-graduation-cap"></i></a>
                <a href="{{ profile.social.researchgate }}" target="_blank" title="ResearchGate"><i class="fab fa-researchgate"></i></a>
                <a href="/cdn-cgi/l/email-protection#f78c8cd7878598919e9b92d9929a969e9bd78a8a" title="Email"><i class="fas fa-envelope"></i></a>
                <a href="https://wa.me/{{ profile.phone.replace('+', '').replace(' ', '').replace('-', '') }}" target="_blank" title="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
            <div class="footer-text">
                © {{ current_year }} {{ profile.name }}. Built with passion for Earth observation.
            </div>
        </div>
    </footer>

    <!-- JavaScript -->
    <script data-cfasync="false" src="/cdn-cgi/scripts/5c5dd728/cloudflare-static/email-decode.min.js"></script><script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('active');
        }
        
        // Close menu when clicking outside
        document.addEventListener('click', function(event) {
            const navLinks = document.getElementById('navLinks');
            const menuToggle = document.querySelector('.menu-toggle');
            
            if (!navLinks.contains(event.target) && !menuToggle.contains(event.target)) {
                navLinks.classList.remove('active');
            }
        });
