# Netlify Configuration for Portfolio Website

[build]
  # Build command
  command = "pip install -r requirements.txt && python build_static.py"
  
  # Directory to publish
  publish = "build"

[build.environment]
  # Python version
  PYTHON_VERSION = "3.11"

# Redirect all routes to index.html for single-page app behavior
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
