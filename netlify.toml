[build]
  command = "pip install -r requirements.txt && python build_static.py"
  publish = "build"

[build.environment]
  PYTHON_VERSION = "3.11"

# Redirect all routes to handle SPA navigation
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Enable form submissions
[[plugins]]
  package = "@netlify/plugin-forms"

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# Cache static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"